name: Build APK & Publish GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug --no-daemon

      - name: Prepare GitHub Pages Site with Direct APK Download
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp android-app/app/build/outputs/apk/debug/app-debug.apk _site/Antigravity-Mobile-Linux.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Antigravity-Mobile-Linux.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Mobile-Linux-APK
          path: Antigravity-Mobile-Linux.apk

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Antigravity Mobile APK v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Antigravity Mobile (Single-App Kiosk APK)
            - 🌐 **Página de Download Direto (GitHub Pages):** https://rafanunesran.github.io/antigravity-mobile/
            - 📥 **Link Direto do APK:** https://rafanunesran.github.io/antigravity-mobile/Antigravity-Mobile-Linux.apk
          files: Antigravity-Mobile-Linux.apk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
