name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Antigravity-Mobile-Linux.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Mobile-Linux-APK
          path: Antigravity-Mobile-Linux.apk

      - name: Publish Latest Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Antigravity Mobile APK v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Antigravity Mobile Linux APK
            Aplicativo Android nativo que gerencia e executa o ambiente **Linux (Ubuntu ARM64)** e abre diretamente o **Google Antigravity** (Modo Desktop Web/noVNC embutido ou Modo Terminal Web/ttyd embutido).

            ### 📥 Como instalar:
            1. Baixe o arquivo **`Antigravity-Mobile-Linux.apk`** abaixo nos *Assets*.
            2. Instale no seu celular ou tablet Android.
            3. Abra o app **Antigravity** e clique em **Iniciar Antigravity Linux**.
          files: Antigravity-Mobile-Linux.apk
